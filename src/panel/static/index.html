<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домовой</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-title" content="Домовой">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/panel.css">
<script type="module" src="/panel.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/favicon.svg" alt="" width="26" height="26"><span>Домовой</span></div>
  <nav id="tabs" class="tabs" aria-label="Разделы" hidden>
    <a href="#" data-view="overview" class="tab">Обзор</a>
    <a href="#timeline" data-view="timeline" class="tab">Лента</a>
    <a href="#editor" data-view="editor" class="tab">Редактор</a>
    <a href="#notifications" data-view="notifications" class="tab">Уведомления<span id="ack-count" class="tab-count" hidden></span></a>
    <a href="#system" data-view="system" class="tab">Система</a>
  </nav>
  <div class="badges">
    <span id="sim-badge" class="badge sim" hidden>Симулятор</span>
    <span id="link" class="badge link" hidden><span class="dot"></span><span id="link-text"></span></span>
    <button id="logout" class="badge logout" hidden>Выйти</button>
  </div>
</header>

<section id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <h1>Вход</h1>
    <label for="password">Пароль панели</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p id="login-error" class="field-error" hidden></p>
    <button class="btn primary" type="submit">Войти</button>
    <p class="hint">Пароль — в переменной PANEL_PASSWORD или в файле panel-password.txt рядом с config.yaml.</p>
  </form>
</section>

<main id="app" hidden>
  <div id="view-overview">
    <div id="acks" class="acks" hidden></div>
    <div id="remote" class="remote"></div>
    <div id="home" class="home"></div>
    <div class="layout">
      <section class="col">
        <h2>Правила</h2>
        <div id="rules" class="stack"></div>
      </section>
      <section class="col">
        <h2>Переменные</h2>
        <div id="vars" class="stack"></div>
        <h2>Устройства <span id="device-count" class="muted"></span></h2>
        <p id="sim-hint" class="hint" hidden>Кнопки «Симулятор» меняют показания датчиков, как будто это сделал настоящий.</p>
        <div id="devices" class="stack"></div>
      </section>
    </div>
  </div>
  <div id="view-timeline" class="timeline" hidden></div>
  <div id="view-editor" class="editor-view" hidden></div>
  <div id="view-notifications" class="page-view" hidden></div>
  <div id="view-device" class="page-view" hidden></div>
  <div id="view-system" class="page-view" hidden></div>
  <div id="view-tablet" class="tablet-view" hidden></div>
</main>
<p id="error" class="error" role="alert" hidden></p>
</body>
</html>
